services:
  - type: web
    name: gympulse-saas
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gympulse-db
          property: connectionString
      - key: AI_PROVIDER
        value: local

databases:
  - name: gympulse-db
    plan: free
